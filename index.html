<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOMINO - Domino Go Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.3);
            border-radius: 3px;
        }
    </style>

    <!-- Firebase SDK (Module Imports) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseModule = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc
        };
    </script>
</head>
<body id="appBody" class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 bg-white text-neutral-900 select-none">

    <!-- メインコンテンツ領域 -->
    <div class="w-full max-w-xl flex flex-col items-center gap-4 sm:gap-5">
        
        <!-- ヘッダー: タイトル & 設定歯車ボタン -->
        <header class="w-full flex items-center justify-between pt-1">
            <div class="w-8"></div> <!-- レイアウト崩れ防止用ダミー -->
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider text-center">GOMINO</h1>
            <button id="btnOpenSettings" title="設定" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-black/5 active:scale-95 transition-all">
                <svg class="w-6 h-6 current-color" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </header>

        <!-- ステータス & 設定バー -->
        <div id="statusCard" class="w-full p-3.5 sm:p-4 rounded-xl flex flex-col gap-3 transition-colors text-sm sm:text-base border">
            <!-- 手番 & モード表示 -->
            <div class="flex items-center justify-between font-medium">
                <div class="flex items-center gap-2">
                    <span class="opacity-70">手番:</span>
                    <span id="turnIndicator" class="font-bold underline decoration-2 underline-offset-4">黒 (1P)</span>
                </div>
                <div id="gameModeBadge" class="text-xs px-2.5 py-1 rounded-full font-semibold border opacity-80">
                    ローカル対戦
                </div>
            </div>

            <!-- アゲハマ (捕獲数) & コミ -->
            <div class="flex items-center justify-between text-xs sm:text-sm pt-1 border-t border-current/10">
                <div class="flex gap-4">
                    <span>黒アゲハマ: <strong id="blackCaptures" class="font-bold">0</strong></span>
                    <span>白アゲハマ: <strong id="whiteCaptures" class="font-bold">0</strong></span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="opacity-70">コミ:</span>
                    <span id="komiDisplay" class="font-bold font-mono">6.5</span>
                </div>
            </div>
        </div>

        <!-- 盤面 Canvas -->
        <div class="w-full flex justify-center items-center relative">
            <canvas id="boardCanvas" class="w-full aspect-square cursor-pointer max-w-[500px] rounded-lg"></canvas>
            
            <!-- AI思考中オーバーレイ -->
            <div id="aiThinkingOverlay" class="absolute inset-0 bg-black/20 backdrop-blur-[1px] rounded-lg flex items-center justify-center hidden">
                <div class="bg-white/90 text-neutral-900 px-4 py-2 rounded-full shadow-lg font-bold text-sm flex items-center gap-2">
                    <div class="w-3.5 h-3.5 border-2 border-neutral-900 border-t-transparent rounded-full animate-spin"></div>
                    AI 思考中...
                </div>
            </div>
        </div>

        <!-- ゲーム操作ボタンエリア -->
        <div class="w-full flex flex-col gap-2">
            <div class="flex justify-between items-center gap-2">
                <!-- 設置向き切り替え -->
                <button id="btnOrientation" class="flex-1 py-2 px-3 text-xs sm:text-sm font-bold border rounded-lg active:scale-95 transition-all flex items-center justify-center gap-1.5">
                    <span>設置向き:</span>
                    <span id="orientationLabel" class="underline decoration-2">自動 (辺タップ)</span>
                </button>

                <!-- パス & 投了 -->
                <button id="btnPass" class="px-4 py-2 text-xs sm:text-sm font-medium border rounded-lg hover:opacity-80 active:scale-95 transition-all">
                    パス
                </button>
                <button id="btnResign" class="px-4 py-2 text-xs sm:text-sm font-medium border border-red-500/50 text-red-600 rounded-lg hover:bg-red-500/10 active:scale-95 transition-all">
                    投了
                </button>
            </div>
        </div>

        <!-- 観戦・結果再表示用バナー -->
        <div id="bannerResult" class="hidden w-full flex items-center justify-between py-2 px-3 bg-neutral-100 text-xs sm:text-sm rounded-lg text-neutral-800 border border-neutral-200">
            <span class="font-medium">対局終了</span>
            <button id="btnShowResultModal" class="font-bold underline hover:opacity-70">
                結果を見る
            </button>
        </div>

        <!-- 操作用インフォメーション -->
        <p class="text-xs opacity-60 text-center leading-relaxed">
            PC: 辺のホバーでプレビュー・クリックで打つ / スマホ: 辺を1タップ目プレビュー、2タップ目確定
        </p>
    </div>

    <!-- 【設定モーダル】 -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div id="settingsCard" class="bg-white text-neutral-900 p-5 sm:p-6 max-w-md w-full rounded-2xl shadow-2xl flex flex-col gap-5 border border-neutral-200 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b pb-3 border-neutral-200">
                <h2 class="text-xl font-bold tracking-wide">ゲーム設定</h2>
                <button id="btnCloseSettings" class="text-neutral-400 hover:text-neutral-800 text-xl font-bold px-2">✕</button>
            </div>

            <!-- 1. 盤面サイズ -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold uppercase tracking-wider text-neutral-500">盤面サイズ</label>
                <div class="grid grid-cols-3 gap-2">
                    <button data-size="9" class="btn-size py-2 rounded-lg border border-neutral-300 font-bold text-sm hover:bg-neutral-100 transition-all">9路盤</button>
                    <button data-size="13" class="btn-size py-2 rounded-lg border border-neutral-300 font-bold text-sm hover:bg-neutral-100 transition-all">13路盤</button>
                    <button data-size="19" class="btn-size py-2 rounded-lg border border-neutral-300 font-bold text-sm hover:bg-neutral-100 transition-all">19路盤</button>
                </div>
            </div>

            <!-- 2. 対戦モード -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold uppercase tracking-wider text-neutral-500">対戦モード</label>
                <div class="grid grid-cols-3 gap-2">
                    <button data-mode="local" class="btn-mode py-2 rounded-lg border border-neutral-300 font-bold text-xs sm:text-sm hover:bg-neutral-100 transition-all">ローカル</button>
                    <button data-mode="ai" class="btn-mode py-2 rounded-lg border border-neutral-300 font-bold text-xs sm:text-sm hover:bg-neutral-100 transition-all">AI対戦</button>
                    <button data-mode="online" class="btn-mode py-2 rounded-lg border border-neutral-300 font-bold text-xs sm:text-sm hover:bg-neutral-100 transition-all">オンライン</button>
                </div>
            </div>

            <!-- AI詳細設定 (モード=ai時のみ表示) -->
            <div id="aiOptions" class="p-3 bg-neutral-50 rounded-xl border border-neutral-200 flex flex-col gap-2 hidden">
                <span class="text-xs font-bold text-neutral-600">プレイヤーの手番:</span>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btnAiPlayerBlack" class="py-1.5 rounded border text-xs font-bold bg-neutral-900 text-white">黒 (先手)</button>
                    <button id="btnAiPlayerWhite" class="py-1.5 rounded border text-xs font-bold bg-white text-neutral-800 border-neutral-300">白 (後手)</button>
                </div>
            </div>

            <!-- オンライン詳細設定 (モード=online時のみ表示) -->
            <div id="onlineOptions" class="p-3 bg-neutral-50 rounded-xl border border-neutral-200 flex flex-col gap-3 hidden text-xs">
                <div class="flex flex-col gap-1">
                    <span class="font-bold text-neutral-700">部屋を作る (ホスト):</span>
                    <button id="btnCreateRoom" class="py-2 bg-neutral-900 text-white font-bold rounded-lg hover:bg-neutral-800 transition-all">
                        ルーム作成
                    </button>
                </div>
                <div class="border-t border-neutral-200 pt-2 flex flex-col gap-1.5">
                    <span class="font-bold text-neutral-700">部屋に入る (ゲスト):</span>
                    <div class="flex gap-2">
                        <input type="text" id="inputRoomId" placeholder="5桁のルームID" maxlength="5" uppercase
                            class="flex-1 px-3 py-1.5 border border-neutral-300 rounded-lg text-center font-mono text-sm uppercase focus:outline-none focus:border-neutral-900">
                        <button id="btnJoinRoom" class="px-4 py-1.5 bg-neutral-800 text-white font-bold rounded-lg hover:bg-neutral-700 transition-all">
                            参加
                        </button>
                    </div>
                </div>
                <div id="onlineRoomStatus" class="text-center font-bold text-neutral-600 pt-1"></div>
            </div>

            <!-- 3. サウンド設定 -->
            <div class="flex items-center justify-between pt-1">
                <span class="text-sm font-bold text-neutral-700">効果音 (SE)</span>
                <button id="btnToggleSound" class="px-3 py-1 text-xs font-bold rounded-full border border-neutral-300 bg-neutral-100">
                    ON
                </button>
            </div>

            <!-- 4. カラーテーマ選択 -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold uppercase tracking-wider text-neutral-500">カラーテーマ</label>
                <div class="grid grid-cols-1 gap-1.5" id="themeList">
                    <!-- JSで動的にテーマボタンを生成 -->
                </div>
            </div>

            <!-- ニューゲームスタート -->
            <button id="btnStartNewGame" class="w-full py-3 bg-neutral-900 text-white font-bold text-sm tracking-wider rounded-xl hover:bg-neutral-800 active:scale-98 transition-all mt-2">
                ニューゲームスタート
            </button>
        </div>
    </div>

    <!-- 【対局結果モーダル】 -->
    <div id="resultModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white text-neutral-900 p-6 sm:p-8 max-w-sm w-full text-center flex flex-col gap-5 rounded-2xl shadow-2xl border border-neutral-200">
            <h2 id="resultTitle" class="text-2xl font-extrabold tracking-wide">対局終了</h2>
            
            <div id="resultDetails" class="text-sm text-neutral-700 flex flex-col gap-2 py-3 border-y border-neutral-200 font-medium">
                <!-- 結果の詳細情報がJSで挿入されます -->
            </div>

            <div class="flex flex-col gap-2 pt-1">
                <button id="btnViewBoard" class="w-full py-2.5 bg-neutral-100 hover:bg-neutral-200 text-neutral-800 text-sm font-bold rounded-xl transition-colors">
                    盤面を確認する
                </button>
                <button id="btnModalRestart" class="w-full py-2.5 bg-neutral-900 hover:bg-neutral-800 text-white text-sm font-bold rounded-xl transition-colors">
                    もう一度遊ぶ
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. カラーテーマ定義
        // ==========================================
        const THEMES = {
            default: {
                id: 'default',
                name: '白 / 黒 (標準)',
                bg: 'bg-white',
                text: 'text-neutral-900',
                subText: 'text-neutral-500',
                boardBg: '#ffffff',
                lineColor: '#171717',
                starColor: '#171717',
                p1Fill: '#171717', p1Stroke: '#000000',
                p2Fill: '#ffffff', p2Stroke: '#171717',
                cardBg: 'bg-neutral-50',
                border: 'border-neutral-200',
                btnBg: 'bg-neutral-900 text-white hover:bg-neutral-800'
            },
            dark: {
                id: 'dark',
                name: '黒 / 白 (ダーク)',
                bg: 'bg-neutral-950',
                text: 'text-neutral-100',
                subText: 'text-neutral-400',
                boardBg: '#0f0f0f',
                lineColor: '#525252',
                starColor: '#a3a3a3',
                p1Fill: '#262626', p1Stroke: '#e5e5e5',
                p2Fill: '#f5f5f5', p2Stroke: '#171717',
                cardBg: 'bg-neutral-900',
                border: 'border-neutral-800',
                btnBg: 'bg-neutral-100 text-neutral-900 hover:bg-white'
            },
            go: {
                id: 'go',
                name: 'ベージュ / 濃い茶色 (伝統碁盤)',
                bg: 'bg-[#f4e4bc]',
                text: 'text-[#3e2211]',
                subText: 'text-[#785338]',
                boardBg: '#e8c88b',
                lineColor: '#3e2211',
                starColor: '#3e2211',
                p1Fill: '#1c1917', p1Stroke: '#000000',
                p2Fill: '#fef3c7', p2Stroke: '#78350f',
                cardBg: 'bg-[#ebd19d]',
                border: 'border-[#cbb07a]',
                btnBg: 'bg-[#3e2211] text-[#f4e4bc] hover:bg-[#27150a]'
            },
            cyber: {
                id: 'cyber',
                name: '紺 / 水色 (ネイビー)',
                bg: 'bg-slate-950',
                text: 'text-sky-100',
                subText: 'text-sky-400',
                boardBg: '#0f172a',
                lineColor: '#0284c7',
                starColor: '#38bdf8',
                p1Fill: '#1e293b', p1Stroke: '#38bdf8',
                p2Fill: '#38bdf8', p2Stroke: '#0284c7',
                cardBg: 'bg-slate-900',
                border: 'border-slate-800',
                btnBg: 'bg-sky-500 text-slate-950 hover:bg-sky-400'
            },
            fancy: {
                id: 'fancy',
                name: 'ピンク / 濃い赤紫 (ファンシー)',
                bg: 'bg-fuchsia-50',
                text: 'text-fuchsia-950',
                subText: 'text-fuchsia-600',
                boardBg: '#fbcfe8',
                lineColor: '#831843',
                starColor: '#831843',
                p1Fill: '#831843', p1Stroke: '#500724',
                p2Fill: '#fff1f2', p2Stroke: '#9f1239',
                cardBg: 'bg-fuchsia-100',
                border: 'border-fuchsia-200',
                btnBg: 'bg-fuchsia-900 text-fuchsia-50 hover:bg-fuchsia-800'
            }
        };

        // ==========================================
        // 2. Web Audio API サウンドシステム
        // ==========================================
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playPlace() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playCapture() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + idx * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.05 + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + idx * 0.05 + 0.12);
                });
            }
            playClick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 600;
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }
            playWin() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.25, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            }
        }

        const soundManager = new SoundManager();

        // ==========================================
        // 3. ゲーム状態変数
        // ==========================================
        let BOARD_SIZE = 9;
        let board = Array(BOARD_SIZE * BOARD_SIZE).fill(0); // 0:空, 1:黒, 2:白
        let dominoes = []; // [{ id, player, p1, p2 }]
        let turn = 1; // 1:黒, 2:白
        let captures = { 1: 0, 2: 0 };
        let orientation = 'H'; // バックコンパチ用
        let komi = 6.5;
        let consecutivePasses = 0;
        let gameOver = false;
        let gameResultData = null;

        // モード & 設定
        let gameMode = 'local'; // 'local' | 'ai' | 'online'
        let aiPlayer = 2; // AIの手番 (2: 白=後手, 1: 黒=先手)
        let currentTheme = THEMES.default;
        let previewPos = null; // { x, y, orientation }

        // オンラインFirebase関連
        let db = null;
        let auth = null;
        let onlineRoomId = null;
        let onlineUnsubscribe = null;
        let myOnlineRole = null; // 1 (Host=Black) | 2 (Guest=White)

        // DOM Elements
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const appBody = document.getElementById('appBody');
        const statusCard = document.getElementById('statusCard');
        const turnIndicator = document.getElementById('turnIndicator');
        const gameModeBadge = document.getElementById('gameModeBadge');
        const blackCapturesEl = document.getElementById('blackCaptures');
        const whiteCapturesEl = document.getElementById('whiteCaptures');
        const komiDisplay = document.getElementById('komiDisplay');
        const orientationLabel = document.getElementById('orientationLabel');
        const btnOrientation = document.getElementById('btnOrientation');
        const btnPass = document.getElementById('btnPass');
        const btnResign = document.getElementById('btnResign');
        const btnOpenSettings = document.getElementById('btnOpenSettings');
        const btnCloseSettings = document.getElementById('btnCloseSettings');
        const settingsModal = document.getElementById('settingsModal');
        const settingsCard = document.getElementById('settingsCard');
        const aiOptions = document.getElementById('aiOptions');
        const onlineOptions = document.getElementById('onlineOptions');
        const btnAiPlayerBlack = document.getElementById('btnAiPlayerBlack');
        const btnAiPlayerWhite = document.getElementById('btnAiPlayerWhite');
        const btnCreateRoom = document.getElementById('btnCreateRoom');
        const btnJoinRoom = document.getElementById('btnJoinRoom');
        const inputRoomId = document.getElementById('inputRoomId');
        const onlineRoomStatus = document.getElementById('onlineRoomStatus');
        const btnToggleSound = document.getElementById('btnToggleSound');
        const btnStartNewGame = document.getElementById('btnStartNewGame');
        const themeList = document.getElementById('themeList');
        const resultModal = document.getElementById('resultModal');
        const resultTitle = document.getElementById('resultTitle');
        const resultDetails = document.getElementById('resultDetails');
        const btnViewBoard = document.getElementById('btnViewBoard');
        const btnModalRestart = document.getElementById('btnModalRestart');
        const bannerResult = document.getElementById('bannerResult');
        const btnShowResultModal = document.getElementById('btnShowResultModal');
        const aiThinkingOverlay = document.getElementById('aiThinkingOverlay');

        // ==========================================
        // 4. カプセル (丸棒/ウィンナー型) 描画 & Canvas
        // ==========================================
        window.addEventListener('resize', resizeCanvas);

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            render();
        }

        function getBoardMetrics() {
            const width = canvas.getBoundingClientRect().width;
            const padding = width * 0.08;
            const cellSize = (width - padding * 2) / (BOARD_SIZE - 1);
            return { width, padding, cellSize };
        }

        // カプセル描画のヘルパー ( translate & rotate を利用 )
        function drawCapsule(ctx, x1, y1, x2, y2, r, fillStyle, strokeStyle, lineWidth = 2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const angle = Math.atan2(dy, dx);
            const dist = Math.hypot(dx, dy);

            ctx.save();
            ctx.translate(x1, y1);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.arc(0, 0, r, Math.PI / 2, -Math.PI / 2);
            ctx.lineTo(dist, -r);
            ctx.arc(dist, 0, r, -Math.PI / 2, Math.PI / 2);
            ctx.lineTo(0, r);
            ctx.closePath();

            if (fillStyle) {
                ctx.fillStyle = fillStyle;
                ctx.fill();
            }
            if (strokeStyle) {
                ctx.strokeStyle = strokeStyle;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }
            ctx.restore();
        }

        function render() {
            const { width, padding, cellSize } = getBoardMetrics();

            // 盤面背景クリア
            ctx.fillStyle = currentTheme.boardBg;
            ctx.fillRect(0, 0, width, width);

            // 格子線
            ctx.strokeStyle = currentTheme.lineColor;
            ctx.lineWidth = 1;
            for (let i = 0; i < BOARD_SIZE; i++) {
                const pos = padding + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(pos, padding);
                ctx.lineTo(pos, width - padding);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(padding, pos);
                ctx.lineTo(width - padding, pos);
                ctx.stroke();
            }

            // 外枠強調
            ctx.strokeStyle = currentTheme.lineColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(padding, padding, width - padding * 2, width - padding * 2);

            // 星 (天元・星の点)
            const starPoints = getStarPoints(BOARD_SIZE);
            ctx.fillStyle = currentTheme.starColor;
            starPoints.forEach(pt => {
                const cx = padding + pt.x * cellSize;
                const cy = padding + pt.y * cellSize;
                ctx.beginPath();
                ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // ドミノ & 石の描画
            drawBoardElements(padding, cellSize);

            // プレビュー描画
            if (!gameOver && previewPos && isMyTurn()) {
                drawPreview(previewPos.x, previewPos.y, previewPos.orientation, padding, cellSize);
            }
        }

        function getStarPoints(size) {
            if (size === 9) {
                return [{x:2,y:2}, {x:6,y:2}, {x:4,y:4}, {x:2,y:6}, {x:6,y:6}];
            } else if (size === 13) {
                return [{x:3,y:3}, {x:9,y:3}, {x:6,y:6}, {x:3,y:9}, {x:9,y:9}];
            } else if (size === 19) {
                return [
                    {x:3,y:3}, {x:9,y:3}, {x:15,y:3},
                    {x:3,y:9}, {x:9,y:9}, {x:15,y:9},
                    {x:3,y:15}, {x:9,y:15}, {x:15,y:15}
                ];
            }
            return [];
        }

        function drawBoardElements(padding, cellSize) {
            const r = cellSize * 0.40;

            // 1. ウインナー型ドミノ (両方のマスに石が残っているもの)
            dominoes.forEach(dom => {
                const idx1 = dom.p1.y * BOARD_SIZE + dom.p1.x;
                const idx2 = dom.p2.y * BOARD_SIZE + dom.p2.x;
                const has1 = board[idx1] === dom.player;
                const has2 = board[idx2] === dom.player;

                if (has1 && has2) {
                    const x1 = padding + dom.p1.x * cellSize;
                    const y1 = padding + dom.p1.y * cellSize;
                    const x2 = padding + dom.p2.x * cellSize;
                    const y2 = padding + dom.p2.y * cellSize;

                    const fill = dom.player === 1 ? currentTheme.p1Fill : currentTheme.p2Fill;
                    const stroke = dom.player === 1 ? currentTheme.p1Stroke : currentTheme.p2Stroke;

                    drawCapsule(ctx, x1, y1, x2, y2, r, fill, stroke, 2);
                }
            });

            // 2. 単体石 (片方の石だけ取られたもの、または個別の石)
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const idx = y * BOARD_SIZE + x;
                    const val = board[idx];
                    if (val === 0) continue;

                    // ドミノで両方の石が健在のものは上で描画済み
                    const isFullDomino = dominoes.some(d => 
                        d.player === val &&
                        ((d.p1.x === x && d.p1.y === y && board[d.p2.y * BOARD_SIZE + d.p2.x] === val) ||
                         (d.p2.x === x && d.p2.y === y && board[d.p1.y * BOARD_SIZE + d.p1.x] === val))
                    );

                    if (!isFullDomino) {
                        const cx = padding + x * cellSize;
                        const cy = padding + y * cellSize;
                        const fill = val === 1 ? currentTheme.p1Fill : currentTheme.p2Fill;
                        const stroke = val === 1 ? currentTheme.p1Stroke : currentTheme.p2Stroke;

                        ctx.beginPath();
                        ctx.arc(cx, cy, r, 0, Math.PI * 2);
                        ctx.fillStyle = fill;
                        ctx.fill();
                        ctx.strokeStyle = stroke;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
            }
        }

        function drawPreview(x, y, orient, padding, cellSize) {
            const secondPos = getSecondPos(x, y, orient);
            const isValid = isValidMove(x, y, orient, turn);

            if (!secondPos) return;

            const x1 = padding + x * cellSize;
            const y1 = padding + y * cellSize;
            const x2 = padding + secondPos.x * cellSize;
            const y2 = padding + secondPos.y * cellSize;
            const r = cellSize * 0.40;

            const fill = isValid 
                ? (turn === 1 ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.65)')
                : 'rgba(239,68,68,0.25)';
            // 枠線は常に線色 (currentTheme.lineColor) に固定
            const stroke = isValid ? currentTheme.lineColor : '#ef4444';

            drawCapsule(ctx, x1, y1, x2, y2, r, fill, stroke, isValid ? 2 : 2);
        }

        // ==========================================
        // 5. 入力処理 (タップ位置の最も近い「辺」に置く)
        // ==========================================
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseleave', handleMouseLeave);
        canvas.addEventListener('click', handleClick);

        // タップ/カーソル位置から「最も近い辺」の位置と向きを取得
        function getGridPosFromEvent(e) {
            const { padding, cellSize } = getBoardMetrics();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (clientX === undefined || clientY === undefined) return null;

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const u = (x - padding) / cellSize;
            const v = (y - padding) / cellSize;

            // 盤面外過ぎる場合は除外
            if (u < -0.8 || u > BOARD_SIZE - 0.2 || v < -0.8 || v > BOARD_SIZE - 0.2) return null;

            let minDistSq = Infinity;
            let bestEdge = null;

            // 水平辺 (c, r) -> (c+1, r)
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE - 1; c++) {
                    const clampedU = Math.max(c, Math.min(c + 1, u));
                    const du = u - clampedU;
                    const dv = v - r;
                    const distSq = du * du + dv * dv;
                    if (distSq < minDistSq) {
                        minDistSq = distSq;
                        bestEdge = { x: c, y: r, orientation: 'H' };
                    }
                }
            }

            // 垂直辺 (c, r) -> (c, r+1)
            for (let r = 0; r < BOARD_SIZE - 1; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const clampedV = Math.max(r, Math.min(r + 1, v));
                    const du = u - c;
                    const dv = v - clampedV;
                    const distSq = du * du + dv * dv;
                    if (distSq < minDistSq) {
                        minDistSq = distSq;
                        bestEdge = { x: c, y: r, orientation: 'V' };
                    }
                }
            }

            return bestEdge;
        }

        function handleMouseMove(e) {
            if (gameOver || !isMyTurn()) return;
            const pos = getGridPosFromEvent(e);
            if (pos) {
                previewPos = pos;
                orientationLabel.textContent = pos.orientation === 'H' ? '横 [ H ]' : '縦 [ V ]';
                render();
            }
        }

        function handleMouseLeave() {
            if (gameOver) return;
            previewPos = null;
            render();
        }

        function handleClick(e) {
            soundManager.init();
            if (gameOver || !isMyTurn()) return;

            const pos = getGridPosFromEvent(e);
            if (!pos) return;

            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            const isMatch = previewPos && 
                            previewPos.x === pos.x && 
                            previewPos.y === pos.y && 
                            previewPos.orientation === pos.orientation;

            if (isMatch || !isTouch) {
                // 着手試行
                if (isValidMove(pos.x, pos.y, pos.orientation, turn)) {
                    executeMove(pos.x, pos.y, pos.orientation, turn);
                    previewPos = null;
                }
            } else {
                // 1タップ目: プレビュー選択
                previewPos = pos;
                orientationLabel.textContent = pos.orientation === 'H' ? '横 [ H ]' : '縦 [ V ]';
                render();
            }
        }

        function isMyTurn() {
            if (gameMode === 'ai') {
                return turn !== aiPlayer;
            } else if (gameMode === 'online') {
                return turn === myOnlineRole;
            }
            return true;
        }

        // ==========================================
        // 6. 囲碁 & GOMINO ルール判定アルゴリズム
        // ==========================================
        function getSecondPos(x, y, orient) {
            const x2 = orient === 'H' ? x + 1 : x;
            const y2 = orient === 'V' ? y + 1 : y;
            if (x2 >= 0 && x2 < BOARD_SIZE && y2 >= 0 && y2 < BOARD_SIZE) {
                return { x: x2, y: y2 };
            }
            return null;
        }

        function isValidMove(x, y, orient, player) {
            const p1 = { x, y };
            const p2 = getSecondPos(x, y, orient);

            if (!p2) return false;

            const idx1 = p1.y * BOARD_SIZE + p1.x;
            const idx2 = p2.y * BOARD_SIZE + p2.x;

            if (board[idx1] !== 0 || board[idx2] !== 0) return false;

            // 仮配置
            const tempBoard = [...board];
            tempBoard[idx1] = player;
            tempBoard[idx2] = player;

            const opponent = player === 1 ? 2 : 1;
            const captured = getCapturedStones(tempBoard, opponent);

            if (captured.length > 0) return true; // 相手石を獲れる手は有効

            // 呼吸点確認 (自殺手チェック)
            const lib1 = getLiberties(tempBoard, idx1);
            const lib2 = getLiberties(tempBoard, idx2);
            return (lib1 + lib2) > 0;
        }

        function executeMove(x, y, orient, player) {
            const p1 = { x, y };
            const p2 = getSecondPos(x, y, orient);
            const idx1 = p1.y * BOARD_SIZE + p1.x;
            const idx2 = p2.y * BOARD_SIZE + p2.x;

            board[idx1] = player;
            board[idx2] = player;

            dominoes.push({
                id: Date.now() + Math.random(),
                player: player,
                p1: p1,
                p2: p2
            });

            // 捕獲処理
            const opponent = player === 1 ? 2 : 1;
            const captured = getCapturedStones(board, opponent);
            if (captured.length > 0) {
                captured.forEach(idx => board[idx] = 0);
                captures[player] += captured.length;
                soundManager.playCapture();
                cleanUpDominoes();
            } else {
                soundManager.playPlace();
            }

            consecutivePasses = 0;
            turn = opponent;
            updateUI();

            // オンライン同期
            if (gameMode === 'online' && onlineRoomId) {
                syncOnlineState();
            }

            // AI思考トリガー
            if (!gameOver && gameMode === 'ai' && turn === aiPlayer) {
                triggerAiMove();
            }
        }

        function cleanUpDominoes() {
            dominoes = dominoes.filter(d => {
                const idx1 = d.p1.y * BOARD_SIZE + d.p1.x;
                const idx2 = d.p2.y * BOARD_SIZE + d.p2.x;
                return board[idx1] !== 0 || board[idx2] !== 0;
            });
        }

        function getCapturedStones(boardState, player) {
            const visited = Array(BOARD_SIZE * BOARD_SIZE).fill(false);
            const captured = [];

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] === player && !visited[i]) {
                    const group = [];
                    let hasLiberty = false;
                    const queue = [i];
                    visited[i] = true;

                    while (queue.length > 0) {
                        const curr = queue.shift();
                        group.push(curr);

                        const neighbors = getNeighbors(curr);
                        neighbors.forEach(n => {
                            if (boardState[n] === 0) {
                                hasLiberty = true;
                            } else if (boardState[n] === player && !visited[n]) {
                                visited[n] = true;
                                queue.push(n);
                            }
                        });
                    }

                    if (!hasLiberty) {
                        captured.push(...group);
                    }
                }
            }
            return captured;
        }

        function getLiberties(boardState, idx) {
            const player = boardState[idx];
            if (player === 0) return 0;

            const visited = Array(BOARD_SIZE * BOARD_SIZE).fill(false);
            const queue = [idx];
            visited[idx] = true;
            let liberties = 0;

            while (queue.length > 0) {
                const curr = queue.shift();
                const neighbors = getNeighbors(curr);
                neighbors.forEach(n => {
                    if (boardState[n] === 0) {
                        liberties++;
                    } else if (boardState[n] === player && !visited[n]) {
                        visited[n] = true;
                        queue.push(n);
                    }
                });
            }
            return liberties;
        }

        function getNeighbors(idx) {
            const x = idx % BOARD_SIZE;
            const y = Math.floor(idx / BOARD_SIZE);
            const neighbors = [];

            if (x > 0) neighbors.push(idx - 1);
            if (x < BOARD_SIZE - 1) neighbors.push(idx + 1);
            if (y > 0) neighbors.push(idx - BOARD_SIZE);
            if (y < BOARD_SIZE - 1) neighbors.push(idx + BOARD_SIZE);

            return neighbors;
        }

        // ==========================================
        // 7. 強力AI思考ルーチン
        // ==========================================
        function triggerAiMove() {
            aiThinkingOverlay.classList.remove('hidden');
            setTimeout(() => {
                if (gameOver) {
                    aiThinkingOverlay.classList.add('hidden');
                    return;
                }
                const bestMove = evaluateBestAiMove();
                aiThinkingOverlay.classList.add('hidden');

                if (bestMove) {
                    executeMove(bestMove.x, bestMove.y, bestMove.o, turn);
                } else {
                    handlePass(); // 候補手がない場合はパス
                }
            }, 400 + Math.random() * 300);
        }

        function evaluateBestAiMove() {
            const candidates = [];
            const orientations = ['H', 'V'];

            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    for (let o of orientations) {
                        if (isValidMove(x, y, o, turn)) {
                            const score = rateMove(x, y, o, turn);
                            candidates.push({ x, y, o, score });
                        }
                    }
                }
            }

            if (candidates.length === 0) return null;

            // スコア降順ソート
            candidates.sort((a, b) => b.score - a.score);
            return candidates[0];
        }

        function rateMove(x, y, orient, player) {
            let score = 0;
            const p1 = { x, y };
            const p2 = getSecondPos(x, y, orient);
            const idx1 = p1.y * BOARD_SIZE + p1.x;
            const idx2 = p2.y * BOARD_SIZE + p2.x;

            const tempBoard = [...board];
            tempBoard[idx1] = player;
            tempBoard[idx2] = player;

            const opponent = player === 1 ? 2 : 1;

            // 1. 相手の石を捕獲できる手 (最高評価)
            const captured = getCapturedStones(tempBoard, opponent);
            score += captured.length * 160;

            // 2. 自分の呼吸点確保
            const lib1 = getLiberties(tempBoard, idx1);
            const lib2 = getLiberties(tempBoard, idx2);
            const totalLib = lib1 + lib2;

            if (totalLib <= 2) score -= 80; // アタリになりやすい場所を回避
            else score += totalLib * 10;

            // 3. 攻め合い (相手の呼吸点を削る)
            const n1 = getNeighbors(idx1);
            const n2 = getNeighbors(idx2);
            [...n1, ...n2].forEach(nIdx => {
                if (board[nIdx] === opponent) {
                    const oppLib = getLiberties(board, nIdx);
                    if (oppLib <= 2) score += 70; // 追い込み
                } else if (board[nIdx] === player) {
                    score += 15; // 味方の連結
                }
            });

            // 4. 中央寄りの進出評価
            const center = (BOARD_SIZE - 1) / 2;
            const dist1 = Math.abs(p1.x - center) + Math.abs(p1.y - center);
            const dist2 = Math.abs(p2.x - center) + Math.abs(p2.y - center);
            score += (BOARD_SIZE - dist1) * 2 + (BOARD_SIZE - dist2) * 2;

            // ノイズで毎回異なる展開に
            score += Math.random() * 8;

            return score;
        }

        // ==========================================
        // 8. パス・投了 & 終局計算
        // ==========================================
        btnPass.addEventListener('click', handlePass);
        btnResign.addEventListener('click', handleResign);

        function handlePass() {
            soundManager.playClick();
            if (gameOver || !isMyTurn()) return;

            consecutivePasses++;
            if (consecutivePasses >= 2) {
                endGameByScore();
            } else {
                turn = turn === 1 ? 2 : 1;
                updateUI();

                if (gameMode === 'online' && onlineRoomId) {
                    syncOnlineState();
                }
                if (!gameOver && gameMode === 'ai' && turn === aiPlayer) {
                    triggerAiMove();
                }
            }
        }

        function handleResign() {
            soundManager.playClick();
            if (gameOver || !isMyTurn()) return;

            const loser = turn;
            const winner = loser === 1 ? 2 : 1;
            const winnerName = winner === 1 ? '黒' : '白';

            gameOver = true;
            gameResultData = {
                title: `${winnerName}の投了勝ち`,
                details: `${loser === 1 ? '黒 (1P)' : '白 (2P)'} が投了しました。`
            };

            soundManager.playWin();
            showResultModal();

            if (gameMode === 'online' && onlineRoomId) {
                syncOnlineState();
            }
        }

        function endGameByScore() {
            gameOver = true;
            const territory = calculateTerritory();

            const blackTotal = territory.black + captures[1];
            const whiteTotal = territory.white + captures[2] + komi;
            const diff = Math.abs(blackTotal - whiteTotal);

            let winnerTitle = '';
            if (blackTotal > whiteTotal) winnerTitle = '黒の勝ち';
            else if (whiteTotal > blackTotal) winnerTitle = '白の勝ち';
            else winnerTitle = '引き分け';

            gameResultData = {
                title: `${winnerTitle} (${diff} 目差)`,
                details: `
                    <div class="flex justify-between"><span>黒の地:</span> <strong>${territory.black}</strong></div>
                    <div class="flex justify-between"><span>黒のアゲハマ:</span> <strong>${captures[1]}</strong></div>
                    <div class="flex justify-between font-bold border-t pt-1"><span>黒合計:</span> <span>${blackTotal}</span></div>
                    <div class="my-1 border-b border-current/10"></div>
                    <div class="flex justify-between"><span>白の地:</span> <strong>${territory.white}</strong></div>
                    <div class="flex justify-between"><span>白のアゲハマ:</span> <strong>${captures[2]}</strong></div>
                    <div class="flex justify-between"><span>コミ:</span> <strong>${komi}</strong></div>
                    <div class="flex justify-between font-bold border-t pt-1"><span>白合計:</span> <span>${whiteTotal}</span></div>
                `
            };

            soundManager.playWin();
            showResultModal();

            if (gameMode === 'online' && onlineRoomId) {
                syncOnlineState();
            }
        }

        function calculateTerritory() {
            const visited = Array(BOARD_SIZE * BOARD_SIZE).fill(false);
            let blackTerritory = 0;
            let whiteTerritory = 0;

            for (let i = 0; i < board.length; i++) {
                if (board[i] === 0 && !visited[i]) {
                    const region = [];
                    let touchesBlack = false;
                    let touchesWhite = false;
                    const queue = [i];
                    visited[i] = true;

                    while (queue.length > 0) {
                        const curr = queue.shift();
                        region.push(curr);

                        const neighbors = getNeighbors(curr);
                        neighbors.forEach(n => {
                            if (board[n] === 0) {
                                if (!visited[n]) {
                                    visited[n] = true;
                                    queue.push(n);
                                }
                            } else if (board[n] === 1) touchesBlack = true;
                            else if (board[n] === 2) touchesWhite = true;
                        });
                    }

                    if (touchesBlack && !touchesWhite) blackTerritory += region.length;
                    else if (touchesWhite && !touchesBlack) whiteTerritory += region.length;
                }
            }
            return { black: blackTerritory, white: whiteTerritory };
        }

        function showResultModal() {
            resultTitle.textContent = gameResultData.title;
            resultDetails.innerHTML = gameResultData.details;
            resultModal.classList.remove('hidden');
        }

        btnViewBoard.addEventListener('click', () => {
            resultModal.classList.add('hidden');
            bannerResult.classList.remove('hidden');
        });

        btnShowResultModal.addEventListener('click', () => {
            resultModal.classList.remove('hidden');
        });

        btnModalRestart.addEventListener('click', () => {
            resultModal.classList.add('hidden');
            bannerResult.classList.add('hidden');
            resetGame();
        });

        // ==========================================
        // 9. Firebase オンライン対戦機能
        // ==========================================
        async function initFirebase() {
            if (db) return;
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.FirebaseModule;

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'gomino-go-app';
            const firebaseConfig = typeof __firebase_config !== 'undefined' 
                ? JSON.parse(__firebase_config)
                : {
                    apiKey: "AIzaSyDummyKey",
                    authDomain: `${appId}.firebaseapp.com`,
                    projectId: appId,
                    storageBucket: `${appId}.appspot.com`
                };

            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            if (initialToken) {
                await signInWithCustomToken(auth, initialToken);
            } else {
                await signInAnonymously(auth);
            }
        }

        btnCreateRoom.addEventListener('click', async () => {
            try {
                soundManager.playClick();
                await initFirebase();
                const { doc, setDoc } = window.FirebaseModule;

                const appId = typeof __app_id !== 'undefined' ? __app_id : 'gomino-go-app';
                const roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
                onlineRoomId = roomId;
                myOnlineRole = 1; // ホスト = 黒

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                
                await setDoc(roomRef, {
                    roomId,
                    boardSize: BOARD_SIZE,
                    board,
                    dominoes,
                    turn: 1,
                    captures,
                    consecutivePasses: 0,
                    gameOver: false,
                    gameResultData: null,
                    status: 'waiting',
                    updatedAt: Date.now()
                });

                onlineRoomStatus.textContent = `ルームID: ${roomId} (相手待機中...)`;
                inputRoomId.value = roomId;

                listenToOnlineRoom(roomRef);
            } catch (err) {
                console.error(err);
                onlineRoomStatus.textContent = "部屋作成エラー";
            }
        });

        btnJoinRoom.addEventListener('click', async () => {
            try {
                soundManager.playClick();
                const roomId = inputRoomId.value.trim().toUpperCase();
                if (roomId.length !== 5) {
                    onlineRoomStatus.textContent = "5桁のIDを入力してください";
                    return;
                }

                await initFirebase();
                const { doc, getDoc, updateDoc } = window.FirebaseModule;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'gomino-go-app';
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                
                const snap = await getDoc(roomRef);
                if (!snap.exists()) {
                    onlineRoomStatus.textContent = "部屋が見つかりません";
                    return;
                }

                const data = snap.data();
                onlineRoomId = roomId;
                myOnlineRole = 2; // ゲスト = 白
                BOARD_SIZE = data.boardSize;

                await updateDoc(roomRef, {
                    status: 'playing',
                    updatedAt: Date.now()
                });

                onlineRoomStatus.textContent = `参加完了！(あなた: 白手番)`;
                listenToOnlineRoom(roomRef);
            } catch (err) {
                console.error(err);
                onlineRoomStatus.textContent = "部屋参加エラー";
            }
        });

        function listenToOnlineRoom(roomRef) {
            if (onlineUnsubscribe) onlineUnsubscribe();
            const { onSnapshot } = window.FirebaseModule;

            onlineUnsubscribe = onSnapshot(roomRef, (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();

                board = data.board;
                dominoes = data.dominoes || [];
                turn = data.turn;
                captures = data.captures;
                consecutivePasses = data.consecutivePasses;
                gameOver = data.gameOver;
                gameResultData = data.gameResultData;

                if (data.status === 'playing' && onlineRoomStatus.textContent.includes('待機')) {
                    onlineRoomStatus.textContent = `対局開始！ (あなた: 黒手番)`;
                }

                if (gameOver && gameResultData) {
                    showResultModal();
                }

                updateUI();
            }, (err) => console.error("Online sync error:", err));
        }

        async function syncOnlineState() {
            if (!onlineRoomId || !db) return;
            const { doc, updateDoc } = window.FirebaseModule;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'gomino-go-app';
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', onlineRoomId);

            await updateDoc(roomRef, {
                board,
                dominoes,
                turn,
                captures,
                consecutivePasses,
                gameOver,
                gameResultData,
                updatedAt: Date.now()
            });
        }

        // ==========================================
        // 10. 設定モーダル & UI / テーマ制御
        // ==========================================
        btnOpenSettings.addEventListener('click', () => {
            soundManager.playClick();
            settingsModal.classList.remove('hidden');
        });

        btnCloseSettings.addEventListener('click', () => {
            soundManager.playClick();
            settingsModal.classList.add('hidden');
        });

        // 盤サイズ選択ボタン
        document.querySelectorAll('.btn-size').forEach(btn => {
            btn.addEventListener('click', (e) => {
                soundManager.playClick();
                document.querySelectorAll('.btn-size').forEach(b => b.classList.remove('bg-neutral-900', 'text-white'));
                e.target.classList.add('bg-neutral-900', 'text-white');
                BOARD_SIZE = parseInt(e.target.dataset.size);
            });
        });

        // モード選択ボタン
        document.querySelectorAll('.btn-mode').forEach(btn => {
            btn.addEventListener('click', (e) => {
                soundManager.playClick();
                document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('bg-neutral-900', 'text-white'));
                e.target.classList.add('bg-neutral-900', 'text-white');
                gameMode = e.target.dataset.mode;

                aiOptions.classList.toggle('hidden', gameMode !== 'ai');
                onlineOptions.classList.toggle('hidden', gameMode !== 'online');
            });
        });

        btnAiPlayerBlack.addEventListener('click', () => {
            soundManager.playClick();
            aiPlayer = 2; // あなた=黒, AI=白
            btnAiPlayerBlack.className = "py-1.5 rounded border text-xs font-bold bg-neutral-900 text-white";
            btnAiPlayerWhite.className = "py-1.5 rounded border text-xs font-bold bg-white text-neutral-800 border-neutral-300";
        });

        btnAiPlayerWhite.addEventListener('click', () => {
            soundManager.playClick();
            aiPlayer = 1; // あなた=白, AI=黒
            btnAiPlayerWhite.className = "py-1.5 rounded border text-xs font-bold bg-neutral-900 text-white";
            btnAiPlayerBlack.className = "py-1.5 rounded border text-xs font-bold bg-white text-neutral-800 border-neutral-300";
        });

        btnToggleSound.addEventListener('click', () => {
            soundManager.enabled = !soundManager.enabled;
            btnToggleSound.textContent = soundManager.enabled ? 'ON' : 'OFF';
            btnToggleSound.classList.toggle('bg-neutral-900', soundManager.enabled);
            btnToggleSound.classList.toggle('text-white', soundManager.enabled);
            soundManager.playClick();
        });

        // テーマボタン生成
        function buildThemeList() {
            themeList.innerHTML = '';
            Object.values(THEMES).forEach(th => {
                const b = document.createElement('button');
                b.className = `w-full p-2.5 rounded-lg border flex items-center justify-between text-xs font-bold transition-all ${th.bg} ${th.text} ${th.border}`;
                b.innerHTML = `
                    <span>${th.name}</span>
                    <div class="flex gap-1">
                        <div class="w-3 h-3 rounded-full border border-black/20" style="background:${th.p1Fill}"></div>
                        <div class="w-3 h-3 rounded-full border border-black/20" style="background:${th.p2Fill}"></div>
                    </div>
                `;
                b.addEventListener('click', () => {
                    soundManager.playClick();
                    applyTheme(th);
                });
                themeList.appendChild(b);
            });
        }

        function applyTheme(th) {
            currentTheme = th;
            appBody.className = `min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 select-none transition-colors duration-300 ${th.bg} ${th.text}`;
            statusCard.className = `w-full p-3.5 sm:p-4 rounded-xl flex flex-col gap-3 transition-colors text-sm sm:text-base border ${th.cardBg} ${th.border}`;
            btnOrientation.className = `flex-1 py-2 px-3 text-xs sm:text-sm font-bold border rounded-lg active:scale-95 transition-all flex items-center justify-center gap-1.5 ${th.cardBg} ${th.border}`;
            btnPass.className = `px-4 py-2 text-xs sm:text-sm font-medium border rounded-lg hover:opacity-80 active:scale-95 transition-all ${th.cardBg} ${th.border}`;
            render();
        }

        btnOrientation.addEventListener('click', () => {
            soundManager.playClick();
        });

        btnStartNewGame.addEventListener('click', () => {
            soundManager.playClick();
            settingsModal.classList.add('hidden');
            resetGame();
        });

        // ==========================================
        // 11. 状態更新 & ゲーム初期化
        // ==========================================
        function updateUI() {
            turnIndicator.textContent = turn === 1 ? '黒 (1P)' : '白 (2P)';
            blackCapturesEl.textContent = captures[1];
            whiteCapturesEl.textContent = captures[2];

            if (gameMode === 'local') gameModeBadge.textContent = 'ローカル対戦';
            else if (gameMode === 'ai') gameModeBadge.textContent = `AI対戦 (${aiPlayer === 2 ? 'あなた:黒' : 'あなた:白'})`;
            else if (gameMode === 'online') gameModeBadge.textContent = `オンライン (${myOnlineRole === 1 ? '黒' : '白'})`;

            render();
        }

        function resetGame() {
            board = Array(BOARD_SIZE * BOARD_SIZE).fill(0);
            dominoes = [];
            turn = 1;
            captures = { 1: 0, 2: 0 };
            consecutivePasses = 0;
            gameOver = false;
            gameResultData = null;
            previewPos = null;

            resultModal.classList.add('hidden');
            bannerResult.classList.add('hidden');

            updateUI();

            if (gameMode === 'ai' && turn === aiPlayer) {
                triggerAiMove();
            }
        }

        // アプリ起動時初期化
        window.onload = () => {
            buildThemeList();
            applyTheme(THEMES.default);

            // デフォルトボタン状態のセット
            document.querySelector('.btn-size[data-size="9"]').classList.add('bg-neutral-900', 'text-white');
            document.querySelector('.btn-mode[data-mode="local"]').classList.add('bg-neutral-900', 'text-white');

            resizeCanvas();
            updateUI();
        };
    </script>
</body>
</html>
